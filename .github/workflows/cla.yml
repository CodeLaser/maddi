name: cla

# Every pull request author must have signed the CodeLaser Contributor License Agreement (CLA.md). The first pull
# request asks for it: the author replies with the sentence below, and the action records the signature. One
# signature covers maddi, maddi-mod and maddi-dist: all three record into the same private repository.
#
# Needs the CLA_SIGNATURES_TOKEN secret: a fine-grained token with contents read/write on CodeLaser/cla-signatures.
# pull_request_target runs with the base branch's workflow and never checks out the pull request's code.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA signed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-document: https://github.com/CodeLaser/maddi/blob/devel/CLA.md
          path-to-signatures: signatures/version1/cla.json
          remote-organization-name: CodeLaser
          remote-repository-name: cla-signatures
          branch: main
          # CodeLaser's own developers, whose work CodeLaser BV already holds; bots, which author nothing
          allowlist: bnaudts,tomtourwe,dependabot[bot],github-actions[bot]
