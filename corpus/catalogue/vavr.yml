name: vavr
status: active
summary: >-
  Maven, ONE module (`vavr`), ~100 main compilation units. Not here for scale — vavr is the first
  target of the analysis-hints campaign. It is a fully PERSISTENT collection library, so almost
  every verdict on it should come out @Immutable(hc=true) / @Independent(hc=true): the expected
  answer is known before the run, which makes a disagreement either a library subtlety worth an
  annotation or an analyzer defect worth a fixture. MAIN ONLY — see the ⛔ under `config`.

source:
  kind: git
  url: https://github.com/vavr-io/vavr.git
  # v1.0.1 (released 2026-03-01), the first 1.0 after nine years of 0.10.x. A `--depth 1 --branch
  # v1.0.1` clone builds fine: unlike langchain4j, nothing in this build reads history.

build:
  cmd: mvn clean install -DskipTests
  expect: complete
  provides:
    - vavr/target/classes
    - vavr/target/test-classes
  # ⛔ RUN THE BUILD **AFTER** THE CONFIG PHASE, NOT BEFORE — vavr is the entry that inverts the
  # usual order. Its pom binds maven-clean-plugin:clean to `generate-sources` (to regenerate
  # src-gen), and maven-clean-plugin ALWAYS deletes ${project.build.directory} as well unless
  # excludeDefaultDirectories is set, which vavr does not set. So every invocation that reaches
  # generate-sources — the config route included — begins by deleting the whole of vavr/target.
  # Measured 2026-09-21 with `mvn -pl vavr generate-test-sources -X`: "[INFO] Deleting
  # .../vavr/target", 335 test classes and 449 main classes gone. Build first and the config route
  # silently un-builds the checkout; `catalogue.py check-provides vavr` then reports MISSING, which
  # is the only thing that says so out loud.
  #
  # `install` is not strictly needed (single module, no sibling to resolve from ~/.m2) but it is
  # what the plugin route below assumes everywhere else, and it costs nothing here.
  #
  # -DskipTests, NOT -Dmaven.test.skip: the test SOURCES must compile. Two of the source roots the
  # config records are written by that compilation — target/generated-sources/annotations
  # (io/vavr/Patterns.java) and target/generated-test-sources/test-annotations
  # (io/vavr/MatchTest_DeveloperPatterns.java), both from vavr-match-processor. src-gen/{main,test}
  # /java are checked in upstream but REGENERATED by scala-maven-plugin on every build, so they are
  # the build's output too. ⚠ A parse that runs while target/ is wiped loses
  # target/generated-sources/annotations without a word: a source ROOT that does not exist
  # contributes nothing and is not an error.

config:
  route: maven-plugin
  module: vavr
  generates: [inputConfiguration.json, inputConfiguration.main.json]

  # ⛔ THE ROUTE'S OWN PHASE DESTROYS A SOURCE ROOT IT IS SUPPOSED TO RECORD, AND THE LOSS IS
  # SILENT. Because generate-sources wipes target/ (see `build` above), the mojo runs in a tree
  # where target/generated-test-sources no longer exists, and it does not record a directory that
  # is not there. The test source set comes out as [src/test/java, src-gen/test/java] — without the
  # annotation-processor root. Nothing in the configuration says so. The parse is where it
  # surfaces, and it surfaces as a REFUSAL, not a warning: MatchTest.java imports
  # io.vavr.MatchTest_DeveloperPatterns, javac reports "cannot find symbol", maddi reports
  # "Parser error(s)" and writes ZERO results.
  # ⚠ Asymmetric, and unexplained: target/generated-sources/annotations IS recorded for the main
  # source set under the same conditions. So existence is not the whole filter — do not assume the
  # main set is safe because it looks complete; check its three roots (the script does).
  #
  # Hence inputConfiguration.main.json: the same configuration with every `test: true` source set
  # dropped (scripts/vavr-main-config.py). That is also the right scope for this corpus — the
  # subject is the library's public API, and its tests would only add assertj/junit noise.
  #
  # ⚠ The main source set has THREE roots and only one of them is src/main/java. The plugin sees
  # the other two (src-gen/main/java, target/generated-sources/annotations) only because the route
  # names a PHASE: they are added by build-helper-maven-plugin, bound to generate-sources. Invoking
  # the mojo alone (`mvn -pl vavr <plugin>:write-input-configuration`, no phase) yields a
  # configuration with one root per source set — 70 of vavr's ~100 main units — and, again, nothing
  # downstream says a third of the library went missing.

parse:
  runner: openjdk
  steps: [prep, modification]
  config: inputConfiguration.main.json
  # No corpus test yet: this entry is driven by hand from the analysis-hints campaign, not from
  # @Tag("slow"). Add one here when vavr earns a regression test of its own.

  # Analysis hints MUST be preloaded (--preload-analysis-results-dirs jdk,libs/test,libs/log) or the
  # positive immutability side barely concludes; see dogfood/README.md, which measured
  # eventuallyImmutableType 0 without and 4 with.

tests:
  # 335 test classes; they compile under the build above and run on JDK 26.
  cmd: mvn -pl vavr test
