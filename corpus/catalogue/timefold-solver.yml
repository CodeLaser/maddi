name: timefold-solver
status: active
summary: >-
  The LARGE Java corpus — ~3,500 types across a 65-source-set Maven reactor, captured whole by the
  compile-log route. The reference case for scale.

source:
  kind: git
  url: https://github.com/TimefoldAI/timefold-solver.git

build:
  cmd: ./mvnw clean install -DskipTests
  expect: complete
  provides:
    - core/target/classes

config:
  route: maven-log
  tasks: test-compile

  # ⛔ `clean` IS NOT OPTIONAL, and it is in the route helper rather than here so no entry can omit
  # it. maven-compiler-plugin skips a module whose classes are up to date, and a skipped module
  # emits no "Command line options:" line at all — so capturing over an already-built reactor
  # yields a SILENTLY PARTIAL config. Measured here: 22 source sets instead of 65, missing
  # core/main, the module everything else depends on. It loads and analyses without complaint, so
  # nothing downstream reveals the loss. The baseline below is the instrument that would catch it.
  #
  # ⚠ `test-compile`, NOT `install` — the opposite of langchain4j, and do not "fix" it by copying
  # that entry. `install` publishes each module to ~/.m2, after which later modules in the reactor
  # resolve siblings from the jar rather than from target/classes; the captured -classpath then
  # names the jar and the parse sees the project's own types defined TWICE, once as a parsed source
  # set and once as a classpath jar. timefold is configured with test-compile and has no such
  # duplication, which is exactly why it loads. (trino is where this was diagnosed: 74 modules.)
  baseline: sourcesets/timefold-solver.tsv
  # compile.log is the raw -X output; compile.javac.log is it filtered to the [DEBUG] -d
  # lines, which is what maddi actually reads (the raw one reaches 2.5GB on camel and dies
  # on the JVM's max array size).
  generates: [compile.log, compile.javac.log, inputConfiguration.json]

parse:
  runner: openjdk
  test: TestTimefoldSolver
  steps: [modification]
  # TestTimefoldSolver also passes --preload-analysis-results-dirs for the JDK analysed-package
  # files; that lives in the test, not here, because it is a property of the runner rather than of
  # the corpus.

  # This corpus is MUTATED IN PLACE by other repos' tests — TestTimefoldDeadCode (removemodule) and
  # TestTimefoldRandomRenames (renamemodule) rewrite the tree while TestTimefoldSolver parses it.
  # They are three different modules, so no per-module setting can express it; the scheduler in
  # jfocus-devops/testrunner uses this tag as an exclusive claim, and every reader and writer of
  # this tree must carry it.
  resource_claim: corpus-timefold-solver

tests:
  # 65 source sets, 28 of them test — the largest reachable-test surface in the catalogue.
  cmd: ./mvnw test
