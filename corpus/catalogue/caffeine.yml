name: caffeine
status: active
summary: >-
  Gradle, a 3-project build (caffeine, guava, jcache, simulator) whose compile log under
  `compileTestJava` yields 11 source sets. Transcribed from codelaser-benchmarks'
  corpora/caffeine.yaml, which holds the experiment's own facts (its sandbox, its recipe, its
  entry-point list) and now names this entry rather than repeating it.

source:
  kind: git
  url: https://github.com/ben-manes/caffeine.git
  rev: 07c6e370c5869e899b3520364dcc778c244ab496
  # ⛔ PART OF THE CORPUS, AND REGENERATED BY EVERY BUILD. caffeine writes 528 cache and node classes
  # here. They must be PRESENT when the configuration is made and when it is parsed -- hand-written
  # tests instantiate them by name (BoundedLocalCacheTest does `new PSW<Object, Object>()`), and
  # without them 341 entry points were unresolvable -- but they are worth nothing to keep across a
  # reset, because `compileTestJava` writes them again. So `clean` deletes them and the next config
  # run recreates them. (codelaser-benchmarks/corpora/caffeine.yaml, `parsedButNeverEdited`.)
  generated:
    - caffeine/build/generated/sources

# No `build`: the config route IS the build. `--rerun-tasks compileTestJava` compiles every one of
# these source sets and its log is what the configuration is made from, so a separate build phase
# would only be thrown away.

config:
  route: gradle-log
  # `compileTestJava`, which reaches 11 of caffeine's source sets. ⚠ NOT the 29-task list in
  # codelaser-benchmarks/corpora/caffeine.yaml under `verifyBuild`: that list exists to prove a
  # MODIFIED tree still compiles everywhere, which is the experiment's verdict and not the shape of
  # the corpus. Widening it here would change the configuration and every count taken from it.
  tasks: compileTestJava
  generates: [compile.log, inputConfiguration.json]

engine:
  project: caffeine
  # `master`, not main -- and it is read from origin/HEAD when this is absent, so it is here only to
  # be explicit about a corpus that predates the rename convention.
  branch: master

parse:
  runner: openjdk

# ⛔ NO `tests` BLOCK, DELIBERATELY. caffeine's suite cannot be run here: `caffeine:test` multiplies
# every test by every configuration in its @CacheSpec matrix, and caffeine's own CI splits the result
# into 40 shards of up to 60 minutes each. One run would cost more than every other corpus together.
# The absence is the statement; see codelaser-benchmarks/corpora/caffeine.yaml `tests.why`, where the
# same reason governs that experiment's verdict.
