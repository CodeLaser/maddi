name: coil
status: active
summary: >-
  Kotlin Multiplatform; the JVM slice of coil-core, flattened into ONE source set (101 .kt files).
  Neither generation route reaches a KMP build, so a script assembles the configuration. Consumed by
  TestCoilJvmSlice.

source:
  kind: git
  url: https://github.com/coil-kt/coil.git
  rev: ec724ef5a72c787cf910de3cae3cc703b3337f25
  # ⚠ The pin matters more here than anywhere: the script's COORDINATES track THIS commit's
  # gradle/libs.versions.toml by hand. Move the pin, re-read that file, update the script.

# Deliberately NOT built. coil applies the Android Gradle plugin, so its build cannot even configure
# without an Android SDK -- and nothing it outputs is needed: the script resolves the slice's compile
# class path from Maven Central itself.

config:
  route: script
  script: ../scripts/coil-input-configuration.py

parse:
  runner: kotlin
  test: TestCoilJvmSlice
  steps: [prep]
  # ⚠ NO config.baseline, for the reason detekt.yml gives: the Kotlin driver cannot parse-only yet.
