name: elasticsearch
status: active
summary: >-
  Gradle, the whole reactor's compile log under `compileTestJava`: 521 source sets. Consumed by
  TestElasticsearchServer through the checked-in SERVER slice (elasticsearch-server-input-configuration.py
  derives it, with relative paths, into maddi's test resources) and read by TestCorpusSweep.

source:
  kind: git
  url: https://github.com/elastic/elasticsearch.git
  rev: f3bfaa7a2a6594df6aae22cde34fced0a0826737

# No `build`: `--rerun-tasks compileTestJava` in the config route is the build.

config:
  route: gradle-log
  tasks: compileTestJava

parse:
  runner: openjdk
  steps: [modification]
  # No `test:` -- TestElasticsearchServer reads the derived slice, not this configuration, and TestCorpusSweep
  # is gated. No baseline yet: 521 source sets is a parse worth recording on purpose, not in passing.
