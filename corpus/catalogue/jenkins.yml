name: jenkins
status: active
summary: >-
  Maven, one module parsed (core) — this is what TestJenkinsCore consumes.

source:
  kind: git
  url: https://github.com/jenkinsci/jenkins.git
  rev: ff6ce687149c2f8e60141b6bbdeed41c2a9fe771

build:
  # ⚠ THE SAME FLAGS ARE NEEDED TWICE. jenkins ships a `.mvn/maven.config` that activates a profile
  # carrying an enforcer rule the pinned enforcer cannot load; the build phase and the config phase
  # are separate `mvn` invocations and neither inherits the other's switches.
  cmd: mvn install -DskipTests -Dlicense.disableCheck -Denforcer.skip=true
  # ⚠ Partial, and deliberately tolerated: jenkins-core packages, then maven-hpi-plugin's
  # record-core-location fails ("No implementation for PluginWorkspaceMap was bound"), so war /
  # core-tests / coverage never run. Maven installs per module, so parent, bom,
  # websocket-{spi,jetty12-ee9} and cli are all in ~/.m2 by then -- everything `mvn -pl core` needs.
  # Revisit if a corpus test ever wants the war.
  #
  # Why -Denforcer.skip and not -P'!might-produce-incrementals', which also gets past the enforcer: that
  # profile also runs `flatten`, which resolves ${changelist} into concrete versions in the INSTALLED
  # POMs. Without it ~/.m2 gets broken sibling versions. Skipping enforcement changes no build output;
  # deactivating the profile does. (The rule that fails: requireExtensionVersion from
  # incrementals-enforcer-rules 1.13, a pre-3.x class the pinned maven-enforcer-plugin 3.6.3 cannot
  # load. It dies in `validate` on jenkins-parent, before anything compiles.)
  expect: partial
  known_failures: >-
    maven-hpi-plugin:record-core-location after jenkins-core; war, core-tests and coverage are not built.
  provides:
    - core/target/classes

config:
  route: maven-plugin
  module: core
  mvn_flags: -Denforcer.skip=true

  # ⛔⛔ THIS ENTRY IS THE REASON THE OTHER TWO EXIST. Until 2026-08-19 jenkins was a Taskfile task
  # with no catalogue entry, so it had no baseline — and its configuration carried no
  # `sourceRelease`, which meant core parsed against whatever JDK maddi happened to be rather than
  # against 21. It had been failing with 100 errors (the ErrorReport cap, so at least 100) at exit
  # code 0, because `--analysis-steps=none` returns 0 whether or not the sources parse. Nothing
  # reported it. A recorded baseline is the instrument that would have.
  baseline: baselines/jenkins.tsv
  generates: [inputConfiguration.json]

parse:
  runner: openjdk
  test: TestJenkinsCore
  steps: [modification]
