name: guava
status: active
summary: >-
  Maven, whole reactor captured from ONE `install` run's compile log (6 source sets, guava-tests
  included). Consumed by TestGuava. The entry the reactor-jar rewrite exists for.

source:
  kind: git
  url: https://github.com/google/guava.git
  rev: 632a864051ddf00fcd5714d2f6e615594636bd9e

# No `build`: the config route's `install -DskipTests` IS the build, and running one first would only be
# thrown away by the route's `clean`.

config:
  route: maven-log
  tasks: install -DskipTests
  # WHY THE COMPILE-LOG ROUTE: the plugin route on module `guava` could not see guava's tests at all. The
  # root pom sets <testSourceDirectory>test</testSourceDirectory> for every module, but `guava` has no
  # test/ -- its tests are a SIBLING module, guava-tests. The old configuration declared a phantom
  # .../guava/guava/test and omitted guava-tests/test, and a green TestGuava showed neither.
  # ⛔ `install`, NOT `test-compile` (the opposite of trino). guava-testlib's module-info `requires
  # com.google.common`, and guava's own module-info is MULTI-RELEASE (META-INF/versions/9): a directory
  # on -classpath exposes no module, so under test-compile javac reports "module not found:
  # com.google.common", guava-testlib fails and guava-tests is skipped. Only the packaged jar makes the
  # module visible -- and `rewrite_reactor_jars` repairs the one thing `install` then breaks.
  # -DskipTests, not -Dmaven.test.skip: the test sources must compile, since their javac line is the point.
  # ⛔ `install`, so later modules name their siblings as target/*.jar -- and maddi would then see those
  # types TWICE, as a parsed source set and as a jar. DELETING the entries is wrong: it is the only link
  # from guava-testlib to guava ("package com.google.common.annotations does not exist", TestGuava dead
  # in 17 s). REWRITING them to target/classes and target/test-classes is byte-for-byte what
  # test-compile would have emitted. Measured: 8 javac invocations carrying 18 such entries.
  rewrite_reactor_jars: true
  generates: [compile.log, compile.javac.log, inputConfiguration.json]

parse:
  runner: openjdk
  test: TestGuava
  steps: [modification]
