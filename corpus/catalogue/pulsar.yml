name: pulsar
status: active
summary: >-
  The MULTI-MODULE Gradle corpus — 90 source sets across ~79 projects, captured whole by the
  compile-log route. This is the tree that found the Gradle plugin's multi-module defects; see
  `pulsar-plugin` for the entry that exercises them.

source:
  kind: git
  url: https://github.com/apache/pulsar.git
  rev: 8576283da4ad3f3742168fc4bf4a527f31923297
  # ⛔ ONE UPSTREAM LINE IS PATCHED, 2026-10-03, and the patch is part of the corpus: `obtain` and
  # `clean` apply it, `doctor` refuses the tree without it, the gate records `<sha>+<patch>`.
  # JDK 27 removed javac's EndPosTable, so Lombok <= 1.18.46 cannot run there and vendor-libraries.py
  # swaps in 1.18.48 -- which refuses PulsarTestContext's `@Builder(builderClassName = "Builder")`:
  #   error: builderClassName cannot be "Builder" when using @Builder; use @lombok.Builder or
  #   choose another builder class name.
  # The failed Lombok round made maddi parse that file without Lombok, and
  # TestCycleMeasurementRatchetPulsar lost types on the Mac (JDK 27). The patch does what the message
  # says (`@lombok.Builder`, no import), as pulsar's own SpyConfig already does; it is neutral under
  # the declared 1.18.42 on JDK 24/26, so every machine parses the same tree. Drop it when the pin
  # moves past an upstream commit that makes the same change.
  patches: [patches/pulsar/lombok-1.18.48-builder.patch]

build:
  # ⛔ -PskipJavaVersionCheck OR THE BUILD REFUSES TO CONFIGURE. pulsar's settings script rejects
  # JDK 26 before any task exists, so this is not a convenience flag: without it nothing runs, and
  # the failure is a configuration error rather than anything about the code.
  cmd: ./gradlew compileTestJava -PskipJavaVersionCheck
  expect: complete
  provides:
    - managed-ledger/build/classes/java/main
    - pulsar-common/build/classes/java/main

config:
  route: gradle-log
  # The flag rides along in `tasks`, which the route interpolates straight into the gradlew line.
  tasks: compileTestJava -PskipJavaVersionCheck
  baseline: baselines/pulsar.tsv
  generates: [compile.log, inputConfiguration.json]

parse:
  runner: openjdk
  steps: [modification]
